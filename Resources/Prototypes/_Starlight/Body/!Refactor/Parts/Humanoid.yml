- type: entity
  id: SLPartHumanoidBase
  #parent: BaseItem #bodyparts are not items, they always live inside a body which MAY be an item!
  name: "humanoid body part"
  abstract: true
  components:
  - type: SLBodyPart
    partType: HumanoidGeneric

- type: entity
  id: SLPartHumanoidTorso
  parent: SLPartHumanoidBase
  abstract: true
  name: "humanoid torso"
  components:
  - type: SLBodyPart
    partType: HumanoidTorso
    sockets:
     Head: HumanoidHeadSocket
     LeftArm: HumanoidArmSocket
     RightArm: HumanoidArmSocket
     LeftLeg: HumanoidLegSocket
     RightLeg: HumanoidLegSocket
     RightWing: HumanoidWingSocket
     LeftWing: HumanoidWingSocket
     Tail: HumanoidTailSocket
     Heart: OrganSocket
     Lungs: OrganSocket
     Stomach: OrganSocket
     Liver: OrganSocket
     Kidneys: OrganSocket
     Cavity: OrganSocket

- type: entity
  id: SLPartHumanoidHead
  parent: SLPartHumanoidBase
  abstract: true
  name: "humanoid head"
  components:
  - type: SLBodyPart
    partType: HumanoidHead
    sockets:
      Eyes: HumanoidEyeSocket
      Brain: OrganSocket
      EyeOrgans: OrganSocket
      Tongue: OrganSocket
      EyeImplant: OrganSocket
      NoseImplant: OrganSocket
      BrainImplant: OrganSocket
      # TODO: split into LeftEye/RightEye once per-eye layers are ready
      #LeftEye: HumanoidEyeSocket
      #RightEye: HumanoidEyeSocket

- type: entity
  id: SLPartHumanoidArm
  parent: SLPartHumanoidBase
  abstract: true
  name: "humanoid arm"
  components:
  - type: SLBodyPart
    partType: HumanoidArm
    sockets:
     Hand: HumanoidHandSocket

- type: entity
  id: SLPartHumanoidHand
  parent: SLPartHumanoidBase
  abstract: true
  name: "humanoid hand"
  components:
  - type: SLBodyPart
    partType: HumanoidHand
    sockets:
     HandImplant: OrganSocket
  - type: BodyPartHand

- type: entity
  id: SLPartHumanoidLeg
  parent: SLPartHumanoidBase
  abstract: true
  name: "humanoid leg"
  components:
  - type: SLBodyPart
    partType: HumanoidLeg
    sockets:
     Foot: HumanoidFootSocket
  - type: MovementBodyPart

- type: entity
  id: SLPartHumanoidFoot
  parent: SLPartHumanoidBase
  abstract: true
  name: "humanoid foot"
  components:
  - type: SLBodyPart
    partType: HumanoidFoot
