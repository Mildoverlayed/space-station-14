- type: entity
  id: BasePart
  parent: BaseItem
  name: "body part"
  abstract: true
  components:
  - type: SurgeryTarget
  - type: BaseLayerId
  - type: Damageable
    damageContainer: Biological
  - type: SLBodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice
    price: 100
  - type: Tag
    tags:
      - Trash
  - type: UserInterface
    interfaces:
      enum.SurgeryUIKey.Key:
        type: SurgeryBui

- type: entity
  id: BaseTorso
  name: "torso"
  parent: BasePart
  abstract: true
  components:
  - type: SLBodyPart
    partType: Torso

- type: entity
  id: BaseHead
  name: "head"
  parent: BasePart
  abstract: true
  components:
  - type: SLBodyPart
    partType: Head
  - type: Input
    context: "ghost"

- type: entity
  id: BaseLeftArm
  name: "left arm"
  parent: BasePart
  abstract: true
  components:
  - type: SLBodyPart
    side: Left
    partType: Arm
  - type: LeftArm #Starlight

- type: entity
  id: BaseRightArm
  name: "right arm"
  parent: BasePart
  abstract: true
  components:
  - type: SLBodyPart
    side: Right
    partType: Arm
  - type: RightArm #Starlight

- type: entity
  id: BaseLeftHand
  name: "left hand"
  parent: BasePart
  abstract: true
  components:
  - type: SLBodyPart
    side: Left
    partType: Hand
  - type: BodyPartHand

- type: entity
  id: BaseRightHand
  name: "right hand"
  parent: BasePart
  abstract: true
  components:
  - type: SLBodyPart
    side: Right
    partType: Hand
  - type: BodyPartHand

- type: entity
  id: BaseLeftLeg
  name: "left leg"
  parent: BasePart
  abstract: true
  components:
  - type: SLBodyPart
    side: Left
    partType: Leg
  - type: MovementBodyPart

- type: entity
  id: BaseRightLeg
  name: "right leg"
  parent: BasePart
  abstract: true
  components:
  - type: SLBodyPart
    side: Right
    partType: Leg
  - type: MovementBodyPart

- type: entity
  id: BaseLeftFoot
  name: "left foot"
  parent: BasePart
  abstract: true
  components:
  - type: SLBodyPart
    side: Left
    partType: Foot

- type: entity
  id: BaseRightFoot
  name: "right foot"
  parent: BasePart
  abstract: true
  components:
  - type: SLBodyPart
    side: Right
    partType: Foot
